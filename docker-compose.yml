services:
  frontend:
    build:
      context: ./front
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./back
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
