services:
  frontend:
    build:
      context: ./front
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend

  backend:
    build:
      context: ./back
    ports:
      - "8080:8080"
    env_file:
      - ./back/.env
    environment:
      - PORT=8080
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_started

  # Redisはメモリ管理
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
