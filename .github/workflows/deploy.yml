name: Continuous Deployment

on:
  push:
    branches: [main, dev] # main または dev にpushされたら自動デプロイ
  workflow_dispatch: # 手動実行用（環境変数だけ更新して再デプロイしたい場合など）

permissions:
  contents: read

jobs:
  # 1. 念のためデプロイ前にもう一度テストを通す
  ci:
    uses: ./.github/workflows/ci.yml

  # 2. フロントエンド（Next.js）を Vercel にデプロイ
  #    main への push は production、dev への push は preview としてデプロイする
  deploy-frontend:
    needs: ci
    runs-on: ubuntu-latest
    # 同一refでの多重実行時、dev用エイリアスの付け替えが実行順の入れ替わりで
    # 古いデプロイに戻ってしまわないよう直列化する
    concurrency:
      group: deploy-frontend-${{ github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: front
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ env.VERCEL_ENV }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.ref_name == 'main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # dev への deploy はコミットごとにURLが変わるため、バックエンドのCORS_ORIGIN等に
      # 固定で指定できるよう常に同じドメインへエイリアスする（main/production側はプロジェクトの
      # 本番ドメインが自動で使われるため不要）
      - name: Alias dev deployment to a stable domain
        if: github.ref_name != 'main'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: vercel alias set "$DEPLOY_URL" nisio-blaze-dev.vercel.app --token=${{ secrets.VERCEL_TOKEN }}

  # 3. バックエンド（Hono）を ECS Fargate にデプロイ（infra/lib/backend-stack.ts 参照）
  #    デプロイ前に Secrets Manager に `blazeapp/backend-prod` / `blazeapp/backend-dev` シークレットを作成しておくこと
  deploy-backend:
    needs: ci
    runs-on: ubuntu-latest
    # AWS OIDC連携に必要な権限はこのジョブでのみ使うため、ここに絞って付与する
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: infra/package-lock.json

      - name: Install CDK app dependencies
        working-directory: infra
        run: npm ci

      # OIDCを利用してAWSに一時クレデンシャルで認証
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsWorkflowRole
          aws-region: ap-northeast-1

      # back/Dockerfile からビルドしてECS Fargateにデプロイ
      # main→prod、dev→dev の別スタックにデプロイされ、インフラが完全に分離される（infra/bin/infra.ts参照）
      # corsOrigin/frontendUrl/mailFrom は Settings > Secrets and variables > Actions > Variables で
      # PROD_CORS_ORIGIN / PROD_FRONTEND_URL / PROD_MAIL_FROM（dev用は DEV_ 接頭辞）を設定しておくこと。
      # 未設定のままだと infra/lib/backend-stack.ts のガードによりここでデプロイが失敗する（意図的な挙動）。
      - name: Deploy to AWS (ECS Fargate)
        working-directory: infra
        run: |
          npx cdk deploy --require-approval never \
            --context stage=${{ github.ref_name == 'main' && 'prod' || 'dev' }} \
            --context "corsOrigin=$CORS_ORIGIN" \
            --context "frontendUrl=$FRONTEND_URL" \
            --context "mailFrom=$MAIL_FROM"
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: ap-northeast-1
          CORS_ORIGIN: ${{ github.ref_name == 'main' && vars.PROD_CORS_ORIGIN || vars.DEV_CORS_ORIGIN }}
          FRONTEND_URL: ${{ github.ref_name == 'main' && vars.PROD_FRONTEND_URL || vars.DEV_FRONTEND_URL }}
          MAIL_FROM: ${{ github.ref_name == 'main' && vars.PROD_MAIL_FROM || vars.DEV_MAIL_FROM }}
