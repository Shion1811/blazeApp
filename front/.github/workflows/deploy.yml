name: Continuous Deployment

on:
  push:
    branches: [main, dev] # maiまたはdevnにマージされたら自動デプロイ

permissions:
  id-token: write # AWS OIDC連携に必要
  contents: read

jobs:
  # 1. 念のためデプロイ前にもう一度テストを通す
  ci:
    uses: ./.github/workflows/ci.yml

  # 2. フロントエンド（React）を Vercel にデプロイ
  deploy-frontend:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # 3. バックエンド（Hono）を AWS にデプロイ (ここではAWS CDKを用いたLambda構成の例)
  deploy-backend:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # OIDCを利用してAWSに一時クレデンシャルで認証
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubActionsWorkflowRole
          aws-region: ap-northeast-1

      # Honoをビルド & CDK等でデプロイ（構成に合わせて変更してください）
      - name: Deploy to AWS Lambda via CDK
        run: |
          npx cdk deploy --require-approval never
